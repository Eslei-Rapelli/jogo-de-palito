<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:radial-gradient(circle at 50% 0,#1f5a3f,#14251f 70%);color:#14251f;min-height:100vh;padding:16px}
.top{text-align:center;color:#fff}.top img{width:96px;height:96px;border-radius:22px;box-shadow:0 4px 14px #0008}
.top h1{margin:6px 0 12px;font-size:22px;color:#ffd84a;letter-spacing:1px}
.card{background:#fffaf0;border-radius:16px;padding:18px;max-width:440px;margin:0 auto;box-shadow:0 6px 20px #0006}
.card h2{margin:4px 0 10px}small{color:#6b7c72;font-weight:700;font-size:11px}
label{display:block;font-size:13px;font-weight:700;margin:10px 0;flex:1}
input,select{width:100%;padding:11px;margin-top:4px;border:1px solid #b8c4bb;border-radius:10px;font-size:15px;background:#fff}
.row{display:flex;gap:10px}
.btn{width:100%;padding:14px;margin-top:10px;border:0;border-radius:12px;background:#14251f;color:#fff;font-size:16px;font-weight:700}
.btn.g{background:#f5b800;color:#14251f}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:10px;margin-top:12px}
.opt{border:3px solid #f5b800;background:#fdf3d6;border-radius:14px;padding:10px 4px;font-weight:800;font-size:15px;display:flex;flex-direction:column;align-items:center;gap:6px}
.opt:disabled{opacity:.35}
.ps{display:flex;gap:4px;height:34px;align-items:flex-end}
.p{width:7px;height:30px;background:linear-gradient(#d33 0 28%,#e8c36a 28%);border-radius:4px 4px 1px 1px}
.pl{font-weight:800;text-align:center;color:#14251f}
.ct{text-align:center}.big{font-size:44px;margin:6px 0}
table{width:100%;border-collapse:collapse;margin:8px 0}td{padding:6px;border-bottom:1px solid #e3dccb}
.ok{color:#0a7a3b;font-weight:800}

const UF='AC AL AP AM BA CE DF ES GO MA MT MS MG PA PB PR PE PI RJ RN RS RO RR SC SP SE TO'.split(' ');
const MC={};let S={};
const J=k=>{try{return JSON.parse(localStorage[k]||'{}')}catch(e){return{}}};
/* ---- som ---- */
let ac;const A=()=>ac=ac||new(window.AudioContext||window.webkitAudioContext)();
function tone(f,t,d,ty='triangle',v=.22){const a=A(),o=a.createOscillator(),g=a.createGain(),s=a.currentTime+t;o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g).connect(a.destination);o.start(s);o.stop(s+d)}
const BASE=[523,587,659,698];
const hit=i=>[1,1.25,1.5,2].forEach((m,k)=>tone(BASE[i]*m,k*.09,.25)); /* timbre/tom próprio de cada jogador */
const fanfare=()=>[523,523,523,659,587,659,784,784,1047].forEach((f,k)=>tone(f,k*.15,.32,'square',.1));
const say=t=>{try{const u=new SpeechSynthesisUtterance(t);u.lang='pt-BR';speechSynthesis.speak(u)}catch(e){}};
/* ---- placar ---- */
const key=n=>n.trim().toLowerCase();
function placar(){const e=Object.values(J('pl')).sort((a,b)=>b.w-a.w).map(x=>`${x.w} para ${x.n}`);
 return e.length?'Placar: '+(e.length>1?e.slice(0,-1).join(', ')+' e '+e.slice(-1):e[0]):''}
function addWin(n){const p=J('pl'),k=key(n);p[k]=p[k]||{n:n,w:0};p[k].w++;localStorage.pl=JSON.stringify(p)}
/* ---- telas ---- */
const head=()=>`<div class=top><img src="${ICON}" alt=""><h1>PORRINHA DIGITAL</h1></div>`;
const sticks=n=>`<div class=ps>${'<i class=p></i>'.repeat(n)}</div>`;
function cad(){const c=J('cad');
 app.innerHTML=head()+`<div class=card><small>A BRINCADEIRA DOS PALITINHOS, ONDE ESTIVER</small><h2>Nova partida</h2>
 <label>Seu nome completo<input id=nm value="${c.n||''}" placeholder="Ex.: Eslei Silva"></label>
 <label>Celular (opcional)<input id=ce value="${c.c||''}" placeholder="Ex.: (17) 99999-9999" inputmode=tel></label>
 <div class=row><label>Estado<select id=uf onchange="$('#ci').value='';munis()"><option value="">Escolha</option>${UF.map(u=>`<option ${u==c.u?'selected':''}>${u}</option>`).join('')}</select></label>
 <label>Cidade<input id=ci list=ml value="${c.ci||''}" placeholder="Sua cidade" autocomplete=off><datalist id=ml></datalist></label></div>
 <label>Quantidade de jogadores<select id=np onchange=names()><option>2</option><option>3</option><option>4</option></select></label>
 <div id=nms></div><button class=btn onclick=go()>Criar partida</button>
 <p class=pl>${placar()}</p><small>Protótipo no mesmo aparelho: a sala online, com cada pessoa no próprio celular, vem na próxima etapa.</small></div>`;
 munis();names()}
async function munis(){const u=$('#uf').value,d=$('#ml');d.innerHTML='';if(!u)return;
 try{let l=MC[u];if(!l){const r=await fetch(`https://servicodados.ibge.gov.br/api/v1/localidades/estados/${u}/municipios?orderBy=nome`);l=(await r.json()).map(m=>m.nome);MC[u]=l}
 d.innerHTML=l.map(n=>`<option value="${n}">`).join('')}catch(e){}}
function names(){const n=+$('#np').value;$('#nms').innerHTML=Array.from({length:n-1},(_,i)=>`<label>Nome do jogador ${i+2}<input class=pn placeholder="Ex.: Rosangela"></label>`).join('')}
function go(){const n=$('#nm').value.trim();if(!n)return alert('Digite seu nome completo.');
 const o=[...document.querySelectorAll('.pn')].map(i=>i.value.trim());if(o.some(x=>!x))return alert('Preencha o nome de todos os jogadores.');
 localStorage.cad=JSON.stringify({n:n,c:$('#ce').value,u:$('#uf').value,ci:$('#ci').value});
 S={ps:[n.split(' ')[0],...o].map(x=>({n:x,s:3})),r:1,ch:[],gs:{}};A();choose(0)}
function pass(i,txt,next){app.innerHTML=head()+`<div class="card ct"><div class=big>✊</div><h2>${S.ps[i].n}</h2><p>${txt}</p><button class="btn g" onclick="${next}">Estou pronto</button></div>`}
function choose(i){pass(i,'Rodada '+S.r+' – só você deve olhar a tela!',`pick(${i})`)}
function pick(i){const p=S.ps[i];
 app.innerHTML=head()+`<div class=card><h2>Escolha seus palitos</h2><p>Toque na opção que deseja esconder:</p><div class=grid>${Array.from({length:p.s+1},(_,k)=>`<button class=opt onclick="setC(${i},${k})">${sticks(k)||''}${k} palito${k==1?'':'s'}</button>`).join('')}</div></div>`}
function setC(i,k){S.ch[i]=k;if(i+1<S.ps.length)choose(i+1);else{S.gs={};S.first=(S.r-1)%S.ps.length;S.t=0;guess()}}
function guess(){const n=S.ps.length,i=(S.first+S.t)%n,max=S.ps.reduce((a,p)=>a+p.s,0);
 app.innerHTML=head()+`<div class=card><h2>Palpite de ${S.ps[i].n}</h2><p>Quantos palitos há em todas as mãos? Números já falados ficam bloqueados.</p><div class=grid>${Array.from({length:max+1},(_,k)=>`<button class=opt ${k in S.gs?'disabled':''} onclick="setG(${i},${k})">${k}</button>`).join('')}</div></div>`;
 document.querySelectorAll('.opt.disabled').forEach(b=>b.disabled=true)}
function setG(i,k){S.gs[k]=i;if(++S.t<S.ps.length)guess();else reveal()}
function reveal(){const tot=S.ch.reduce((a,b)=>a+b,0),w=S.gs[tot];
 let rows=S.ps.map((p,i)=>{const g=Object.keys(S.gs).find(k=>S.gs[k]==i);return`<tr><td>${p.n}</td><td>escondeu ${S.ch[i]}</td><td>palpite ${g}</td></tr>`}).join('');
 let msg;if(w===undefined)msg='Ninguém acertou. Ninguém perde palito!';
 else{S.ps[w].s--;hit(w);msg=`<span class=ok>${S.ps[w].n} acertou e tira um palito! Restam ${S.ps[w].s}.</span>`}
 const done=w!==undefined&&S.ps[w].s==0;
 app.innerHTML=head()+`<div class="card ct"><h2>Total: ${tot} palitos</h2><table>${rows}</table><p>${msg}</p>${S.ps.map(p=>`<div>${p.n}: ${p.s}</div>`).join('')}
 <button class="btn g" onclick="${done?`fim(${w})`:'S.r++;choose(0)'}">${done?'Ver campeão':'Próxima rodada'}</button></div>`}
function fim(w){const n=S.ps[w].n;addWin(n);fanfare();setTimeout(()=>say(n+' é o campeão!'),900);
 app.innerHTML=head()+`<div class="card ct"><div class=big>🏆</div><h2>${n} é o campeão!</h2><p class=pl>${placar()}</p>
 <button class="btn g" onclick="S.ps.forEach(p=>p.s=3);S.r=1;choose(0)">Jogar de novo</button><button class=btn onclick=cad()>Nova partida</button></div>`}
cad();
</script></body></html>
