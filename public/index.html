<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#14251f">
<title>Porrinha Digital</title>
<link rel="icon" href="/icon.png"><link rel="apple-touch-icon" href="/icon.png">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:radial-gradient(circle at 50% 0,#1f5a3f,#14251f 70%) fixed;color:#14251f;min-height:100vh;padding:16px}
.top{text-align:center;color:#fff}.top img{width:88px;height:88px;border-radius:20px;box-shadow:0 4px 14px #0008}
.top h1{margin:6px 0 12px;font-size:21px;color:#ffd84a;letter-spacing:1px}
.card{background:#fffaf0;border-radius:16px;padding:18px;max-width:460px;margin:0 auto 12px;box-shadow:0 6px 20px #0006}
.card h2{margin:4px 0 10px}small{color:#6b7c72;font-weight:700;font-size:11px}
label{display:block;font-size:13px;font-weight:700;margin:10px 0;flex:1}
input,select{width:100%;padding:11px;margin-top:4px;border:1px solid #b8c4bb;border-radius:10px;font-size:15px;background:#fff}
.row{display:flex;gap:10px}
.btn{width:100%;padding:14px;margin-top:10px;border:0;border-radius:12px;background:#14251f;color:#fff;font-size:16px;font-weight:700}
.btn.g{background:#f5b800;color:#14251f}.btn.o{background:#fff;color:#14251f;border:1px solid #b8c4bb}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:10px;margin-top:12px}
.opt{border:3px solid #f5b800;background:#fdf3d6;border-radius:14px;padding:10px 4px;font-weight:800;font-size:15px;display:flex;flex-direction:column;align-items:center;gap:6px}
.opt:disabled{opacity:.3}
.ps{display:flex;gap:3px;height:26px;align-items:flex-end;justify-content:center}
.p{width:6px;height:22px;background:linear-gradient(#d33 0 28%,#e8c36a 28%);border-radius:4px 4px 1px 1px}
.pl{font-weight:800;text-align:center}.ct{text-align:center}.big{font-size:44px;margin:6px 0}
.code{font-size:46px;font-weight:900;letter-spacing:8px;text-align:center;color:#14251f}
.bar{display:flex;gap:8px;max-width:460px;margin:0 auto 12px}
.pp{flex:1;background:#ffffff22;color:#fff;border-radius:10px;padding:6px 4px;text-align:center;font-size:12px;font-weight:700}
.pp.me{background:#f5b800;color:#14251f}.pp .ps{margin-top:4px}
table{width:100%;border-collapse:collapse;margin:8px 0}td{padding:6px;border-bottom:1px solid #e3dccb}
.ok{color:#0a7a3b;font-weight:800}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s),app=$('#app');
const UF='AC AL AP AM BA CE DF ES GO MA MT MS MG PA PB PR PE PI RJ RN RS RO RR SC SP SE TO'.split(' ');
const MC={};let st=null,plc=[],ws;
const id=localStorage.pid||(localStorage.pid=Math.random().toString(36).slice(2)+Date.now().toString(36));
const J=k=>{try{return JSON.parse(localStorage[k]||'{}')}catch(e){return{}}};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* ---- som ---- */
let ac;const A=()=>ac=ac||new(window.AudioContext||window.webkitAudioContext)();
document.addEventListener('click',()=>{try{A().resume()}catch(e){}});
function tone(f,t,d,ty='triangle',v=.22){const a=A(),o=a.createOscillator(),g=a.createGain(),s=a.currentTime+t;o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g).connect(a.destination);o.start(s);o.stop(s+d)}
const BASE=[523,587,659,698];
const hit=i=>[1,1.25,1.5,2].forEach((m,k)=>tone(BASE[i%4]*m,k*.09,.25));
const fanfare=()=>[523,523,523,659,587,659,784,784,1047].forEach((f,k)=>tone(f,k*.15,.32,'square',.1));
const say=t=>{try{const u=new SpeechSynthesisUtterance(t);u.lang='pt-BR';speechSynthesis.speak(u)}catch(e){}};
function fx(o,n){if(!n.res||(o&&o.ph===n.ph&&o.r===n.r))return;
 try{if(n.res.w!==null)hit(n.res.w);if(n.ph==='end'){fanfare();setTimeout(()=>say(n.ps[n.res.w].n+' é o campeão!'),900)}}catch(e){}}
/* ---- rede ---- */
function conn(){ws=new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host);
 ws.onopen=()=>send({t:'hello'});
 ws.onmessage=e=>{const m=JSON.parse(e.data);
  if(m.t==='err')return alert(m.m);
  if(m.t==='none'){st=null;plc=m.p||plc;if(m.m)alert(m.m);return draw()}
  if(m.t==='v'){const o=st;st=m.v;plc=m.v.plc;fx(o,st);draw()}};
 ws.onclose=()=>setTimeout(conn,1500)}
const send=o=>{if(ws&&ws.readyState===1)ws.send(JSON.stringify({...o,id}));else alert('Sem conexão. Tente de novo em instantes.')};
/* ---- util ---- */
const placarTxt=l=>{const e=l.map(x=>`${x.w} para ${esc(x.n)}`);return e.length?'Placar geral: '+(e.length>1?e.slice(0,-1).join(', ')+' e '+e.slice(-1):e[0]):''};
const sticks=n=>`<div class=ps>${'<i class=p></i>'.repeat(n)}</div>`;
const head=()=>`<div class=top><img src="/icon.png" alt=""><h1>PORRINHA DIGITAL</h1></div>`;
/* ---- telas ---- */
function draw(){if(!st)return cad();const s=st,n=s.ps.length;let b='';
 const bar=s.ph==='lobby'?'':`<div class=bar>${s.ps.map((p,i)=>`<div class="pp ${i==s.me?'me':''}">${esc(p.n)}${p.on?'':' (off)'}${sticks(p.s)}</div>`).join('')}</div>`;
 if(s.ph==='lobby')b=`<small>SALA</small><div class=code>${s.code}</div><p class=ct>Passe o código ou o link para a família:</p>
  <input readonly value="${location.origin}/?sala=${s.code}" onclick="this.select()"><button class="btn g" onclick=share()>Compartilhar</button>
  <table>${s.ps.map(p=>`<tr><td>${esc(p.n)}${p.on?'':' (off)'}</td><td>${esc(p.ci)}${p.uf?' - '+esc(p.uf):''}</td><td>${esc(p.cel)}</td></tr>`).join('')}</table>
  ${s.host?(n>=2?`<button class="btn" onclick="send({t:'start'})">Começar partida (${n} jogadores)</button>`:'<p class=ct>Aguardando pelo menos 2 jogadores...</p>'):'<p class=ct>Aguardando o anfitrião começar...</p>'}
  <button class="btn o" onclick=sair()>Sair</button>`;
 else if(s.ph==='choose'){const me=s.ps[s.me];
  b=s.mine===undefined?`<h2>Rodada ${s.r}: escolha seus palitos</h2><p>Toque na opção que deseja esconder:</p><div class=grid>${Array.from({length:me.s+1},(_,k)=>`<button class=opt onclick="send({t:'choose',n:${k}})">${sticks(k)}${k} palito${k==1?'':'s'}</button>`).join('')}</div>`
  :`<div class=ct><div class=big>✊</div><h2>Escolha feita!</h2><p>Aguardando os outros (${s.done.filter(Boolean).length}/${n})...</p></div>`}
 else if(s.ph==='guess'){const max=s.ps.reduce((a,p)=>a+p.s,0),gl=Object.entries(s.gs).map(([k,i])=>`${esc(s.ps[i].n)}: ${k}`).join(' | ');
  b=s.turn===s.me?`<h2>Sua vez de palpitar</h2><p>Quantos palitos há em todas as mãos?</p><div class=grid>${Array.from({length:max+1},(_,k)=>`<button class=opt ${s.gs[k]!==undefined?'disabled':''} onclick="send({t:'guess',n:${k}})">${k}</button>`).join('')}</div>`
  :`<div class=ct><div class=big>🤔</div><h2>Vez de ${esc(s.ps[s.turn].n)}</h2><p>Aguardando o palpite...</p></div>`;
  b+=gl?`<p class=ct><small>Palpites: ${gl}</small></p>`:'';
  setTimeout(()=>document.querySelectorAll('.opt.disabled').forEach(x=>x.disabled=true))}
 else{const r=s.res,w=r.w,end=s.ph==='end';
  b=`<div class=ct>${end?'<div class=big>🏆</div>':''}<h2>${end?esc(s.ps[w].n)+' é o campeão!':'Total: '+r.tot+' palitos'}</h2>
  <table>${s.ps.map((p,i)=>{const g=Object.keys(r.gs).find(k=>r.gs[k]==i);return`<tr><td>${esc(p.n)}</td><td>escondeu ${r.ch[i]}</td><td>palpite ${g}</td></tr>`}).join('')}</table>
  <p>${w===null?'Ninguém acertou. Ninguém perde palito!':`<span class=ok>${esc(s.ps[w].n)} acertou e tira um palito! Restam ${s.ps[w].s}.</span>`}</p>
  ${end?`<p class=pl>${placarTxt(s.plc)}</p><p><small>Vitórias nesta sala: ${s.ps.map(p=>esc(p.n)+' '+p.w).join(' | ')}</small></p>`:''}
  ${s.host?`<button class="btn g" onclick="send({t:'${end?'again':'next'}'})">${end?'Jogar de novo':'Próxima rodada'}</button>`:'<p><small>Aguardando o anfitrião...</small></p>'}
  <button class="btn o" onclick=sair()>Sair</button></div>`}
 app.innerHTML=head()+bar+`<div class=card>${b}</div>`}
function cad(){const c=J('cad'),q=new URLSearchParams(location.search).get('sala')||'';
 app.innerHTML=head()+`<div class=card><small>A FAMÍLIA REUNIDA, ONDE ESTIVER</small><h2>Porrinha Digital</h2>
 <p>Preencha seus dados, depois crie uma sala ou entre com o código que recebeu.</p>
 <label>Seu nome completo<input id=nm value="${esc(c.n)}" placeholder="Ex.: Eslei Silva"></label>
 <label>Celular (opcional)<input id=ce value="${esc(c.c)}" placeholder="Ex.: (17) 99999-9999" inputmode=tel></label>
 <div class=row><label>Estado<select id=uf onchange="$('#ci').value='';munis()"><option value="">Escolha</option>${UF.map(u=>`<option ${u==c.u?'selected':''}>${u}</option>`).join('')}</select></label>
 <label>Cidade<input id=ci list=ml value="${esc(c.ci)}" placeholder="Sua cidade" autocomplete=off><datalist id=ml></datalist></label></div>
 <label>Código da sala (para entrar)<input id=cd value="${esc(q.toUpperCase())}" maxlength=4 placeholder="Ex.: ABCD" style="text-transform:uppercase"></label>
 <div class=row><button class=btn onclick="ir('create')">Criar sala</button><button class="btn o" onclick="ir('join')">Entrar em uma sala</button></div>
 <p class=pl>${placarTxt(plc)}</p>
 <small>Quem cria a sala é o anfitrião e começa a partida. Os outros entram com o código e jogam no próprio celular. Nome, cidade e estado aparecem para quem está na sala; o celular aparece só para o anfitrião.</small></div>`;munis()}
async function munis(){const u=$('#uf').value,d=$('#ml');d.innerHTML='';if(!u)return;
 try{let l=MC[u];if(!l){const r=await fetch(`https://servicodados.ibge.gov.br/api/v1/localidades/estados/${u}/municipios?orderBy=nome`);l=(await r.json()).map(m=>m.nome);MC[u]=l}
 d.innerHTML=l.map(n=>`<option value="${n}">`).join('')}catch(e){}}
function ir(t){const n=$('#nm').value.trim();if(!n)return alert('Digite seu nome completo.');
 const cd=$('#cd').value.trim();if(t==='join'&&cd.length<4)return alert('Digite o código da sala.');
 const pf={name:n,cel:$('#ce').value,uf:$('#uf').value,ci:$('#ci').value};
 localStorage.cad=JSON.stringify({n:n,c:pf.cel,u:pf.uf,ci:pf.ci});send({t,code:cd,pf})}
function sair(){if(confirm('Sair da sala? Se a partida já começou, ela será encerrada para todos.')){send({t:'leave'});history.replaceState(null,'','/')}}
function share(){const u=`${location.origin}/?sala=${st.code}`,t='Vem jogar Porrinha comigo! Código da sala: '+st.code;
 if(navigator.share)navigator.share({title:'Porrinha Digital',text:t,url:u}).catch(()=>{});else{navigator.clipboard&&navigator.clipboard.writeText(t+' '+u);alert('Link copiado!')}}
cad();conn();
</script></body></html>
